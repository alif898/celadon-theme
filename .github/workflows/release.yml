name: Release
on:
  release:
    types: [published]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.BYPASS_TOKEN }}
          persist-credentials: false

      - name: Sync version and changelog
        env:
          FULL_TAG: ${{ github.event.release.tag_name }}
          NOTES: ${{ github.event.release.body }}
        run: |
          set -euo pipefail
          CLEAN_VERSION="${FULL_TAG#v}"
          # Canonical SemVer pattern (semver.org), adapted to POSIX ERE for grep -E
          if ! echo "$CLEAN_VERSION" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*))?(\+([0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*))?$'; then
            echo "::error::Release tag '$FULL_TAG' is not valid SemVer (expected vX.Y.Z)"
            exit 1
          fi
          DATE=$(date +'%Y-%m-%d')
          
          echo "Processing Release: $FULL_TAG"
          
          CURRENT_VERSION=$(jq -r '.version' config.json)
          if [ "$CLEAN_VERSION" != "$CURRENT_VERSION" ]; then
            echo "Updating config.json to $CLEAN_VERSION..."
            jq --arg ver "$CLEAN_VERSION" --arg notes "$NOTES" \
               '.version = $ver | .change_notes = $notes' \
               config.json > config.json.tmp && mv config.json.tmp config.json
          fi
          
          if ! grep -q "## \[$FULL_TAG\]" CHANGELOG.md; then
            echo "Updating Changelog..."
            echo "# Changelog" > CHANGELOG.new
            echo "" >> CHANGELOG.new
            echo "## [$FULL_TAG] - $DATE" >> CHANGELOG.new
            echo "$NOTES" >> CHANGELOG.new
            echo "" >> CHANGELOG.new
            tail -n +2 CHANGELOG.md >> CHANGELOG.new
            mv CHANGELOG.new CHANGELOG.md
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev pkg-config

      - name: Generate theme files
        run: uv run celadon-theme

      - name: Run linter
        run: uv run ruff check

      - name: Run formatter
        run: uv run ruff format --check

      - name: Run static type checking
        run: uv run ty check

      - name: Run Python tests
        run: uv run pytest

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: true

      - name: Verify JetBrains plugin
        working-directory: jetbrains
        run: |
          chmod +x gradlew
          ./gradlew verifyPlugin

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '23'

      - name: Install vsce
        run: npm install -g @vscode/vsce

      - name: Install Open VSX tools
        run: npm install -g ovsx

      - name: Build VS Code extension
        working-directory: vscode
        run: vsce package --no-git-tag-version

      - name: Commit version and changelog back to Main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add config.json CHANGELOG.md
          
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "[skip ci]: ${{ github.event.release.tag_name }} release, sync version and changelog"
            git push https://x-access-token:${{ secrets.BYPASS_TOKEN }}@github.com/${{ github.repository }}.git main
          fi

      - name: Upload assets to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(jq -r '.version' config.json)
          # The `#label` suffix is display-only. It shows the versioned name on the
          # release page, while the asset keeps its filename so the stable
          # releases/latest/download/<name>.json URLs keep working.
          gh release upload ${{ github.event.release.tag_name }} \
            ./jetbrains/build/distributions/*.zip \
            ./vscode/*.vsix \
            "./claude-code/celadon-claude-code.json#celadon-claude-code-${VERSION}.json" \
            "./qwen-code/celadon-qwen-code.json#celadon-qwen-code-${VERSION}.json" \
            "./kimi-code/celadon-kimi-code.json#celadon-kimi-code-${VERSION}.json" \
            "./pi/celadon-pi.json#celadon-pi-${VERSION}.json" \
            "./windows-terminal/celadon-windows-terminal.json#celadon-windows-terminal-${VERSION}.json" \
            --clobber

      - name: Publish to JetBrains Marketplace
        if: ${{ !github.event.release.prerelease }}
        working-directory: jetbrains
        run: |
          chmod +x gradlew
          ./gradlew publishPlugin
        env:
          PUBLISH_TOKEN: ${{ secrets.JETBRAINS_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}

      - name: Publish to VS Code Marketplace
        if: ${{ !github.event.release.prerelease }}
        working-directory: vscode
        env:
          VSCE_TOKEN: ${{ secrets.VSCE_TOKEN }}
        run: vsce publish -p "$VSCE_TOKEN" --no-git-tag-version

      - name: Publish to Open VSX Registry
        if: ${{ !github.event.release.prerelease }}
        working-directory: vscode
        run: ovsx publish -p ${{ secrets.OPEN_VSX_TOKEN }}